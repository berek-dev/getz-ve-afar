name: Weekly DB backup

# גיבוי שבועי של D1 כ-artifact (נשמר 90 יום).
# רץ רק כשהריפו פרטי – בריפו ציבורי artifacts נגישים לכל מי שרואה את הריפו, וזה מידע של לקוחות.
# בנוסף, ל-D1 יש Time Travel מובנה: שחזור לכל נקודה ב-7 הימים האחרונים.

on:
  schedule:
    - cron: '23 1 * * 0' # ראשון 01:23 UTC
  workflow_dispatch:

jobs:
  backup:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set – skipping backup"
            exit 0
          fi
          npx --yes wrangler@4 d1 export getz-ve-afar --remote --output "backup-$(date -u +%Y-%m-%d).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90
          if-no-files-found: ignore
