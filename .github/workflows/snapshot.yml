name: UI snapshot

# Builds the app and keeps the built files on the `ui-snapshot` branch, for making training videos and screenshots of
# the newest screens without a local build. Run by hand. The built files are the same ones the site serves.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Push dist to ui-snapshot
        run: |
          cd dist
          git init -q -b ui-snapshot
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "UI snapshot of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-snapshot
