name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Deploys every push to main once the one-time Setup workflow has run.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not set up yet (run the Setup workflow) – skipping deploy."
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.ready.outputs.ok == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.ready.outputs.ok == 'true'
        name: Apply new database migrations
        run: npx wrangler d1 migrations apply getz-ve-afar --remote
      - if: steps.ready.outputs.ok == 'true'
        name: Photo storage (Workers KV, free tier)
        # Optional: if this fails (e.g. the token has no KV permission) the app deploys without photos.
        continue-on-error: true
        run: |
          NAME=getz-ve-afar-photos
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const i = s.indexOf("[");
                if (i < 0) return;
                const ns = JSON.parse(s.slice(i)).find((n) => n.title === process.argv[1] || n.title.endsWith("-" + process.argv[1]));
                if (ns) console.log(ns.id);
              });' "$NAME"
          }
          ID=$(find_id || true)
          if [ -z "$ID" ]; then
            (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" kv namespace create "$NAME")
            ID=$(find_id || true)
          fi
          if [ -z "$ID" ]; then
            echo "::warning::Photo storage could not be set up – photos stay off."
            exit 0
          fi
          if ! grep -q 'binding = "PHOTOS"' wrangler.toml; then
            printf '\n[[kv_namespaces]]\nbinding = "PHOTOS"\nid = "%s"\n' "$ID" >> wrangler.toml
          fi
          echo "Photo storage ready ($ID)"
      - if: steps.ready.outputs.ok == 'true'
        name: Build and deploy
        run: |
          npm run build
          npx wrangler pages deploy --project-name getz-ve-afar --branch main --commit-dirty=true
