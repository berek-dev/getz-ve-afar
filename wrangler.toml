name = "getz-ve-afar"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Database (D1). After `npx wrangler d1 create getz-ve-afar`, paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "getz-ve-afar"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secrets (never in this file!): APP_PASSWORD_HASH and SESSION_SECRET.
# Set them as Pages secrets – see README step 5.
